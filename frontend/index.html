<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Sovereign AI Workbench for confidential industrial work" />
    <title>Sovereign AI Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted theme before React renders to avoid a flash/dark mismatch
      try {
        var storedTheme = localStorage.getItem('antar_ai_theme');
        document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
